name: Build and push image

# Baut bei jedem Push auf main ein Image und legt es in der GitHub Container
# Registry ab. Portainer zieht es von dort (SPEC ss16).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  # Ein laufender Build je Branch reicht; ein neuer Push macht den alten obsolet.
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Bewusst als Tor vor dem Push: ein Image mit roten Tests soll nicht in der
    # Registry landen und schon gar nicht von Portainer gezogen werden.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Vom Runner automatisch bereitgestellt - kein eigenes Secret noetig.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Kleinschreibung erledigt die Action; ghcr.io verlangt sie.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Erst lokal laden, damit der Smoke-Test im *gebauten* Image laufen kann.
      # Der zweite Build weiter unten trifft dank Cache nur noch den Push.
      - name: Build (lokal laden)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: decentespresso-mcp:smoke
          build-args: |
            BUILD_REF=${{ github.sha }}
          # Baucache zwischen Laeufen: der pip-Schritt dominiert die Laufzeit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test im gebauten Image
        # Prueft genau das, was sich lokal nicht pruefen laesst: dass der
        # Profilparser im Container laeuft.
        #
        # Der Interpreter wird hier *erzwungen*. In python:*-slim ist _tkinter
        # einkompiliert, aber ohne libtk8.6 scheitert 'import tkinter' an
        # "libtk8.6.so: cannot open shared object file". Faellt die apt-Zeile im
        # Dockerfile weg, soll der Build rot werden - nicht der Container beim
        # Start. Genau dieser Absturz ist einmal in Produktion passiert.
        run: |
          docker run --rm decentespresso-mcp:smoke python - <<'PY'
          import tkinter                     # bricht ohne libtk8.6 sofort ab
          from decentespresso_mcp.tcl_profile import (
              TCL_IMPORT_ERROR, TCL_INTERPRETER_AVAILABLE, parse_profile, semantic_hash,
          )

          assert TCL_INTERPRETER_AVAILABLE, (
              "Tcl-Interpreter fehlt im Image - libtk8.6 im Dockerfile pruefen. "
              f"Importfehler: {TCL_IMPORT_ERROR}"
          )
          print(f"Tcl-Interpreter im Image: ok (Tk {tkinter.TkVersion})")

          raw = (
              "advanced_shot {}\n"
              "author Decent\n"
              "beverage_type espresso\n"
              "espresso_pressure 8.9\n"
              "espresso_temperature 88.0\n"
              "final_desired_shot_weight 40.0\n"
              "preinfusion_time 20\n"
              "profile_title {Smoke Test}\n"
              "profile_notes {Zwei Zeilen\nmit Umbruch}\n"
              "settings_profile_type settings_2a\n"
          )
          parsed = parse_profile(raw)
          assert parsed["parse_ok"] is True, parsed
          assert parsed["title"] == "Smoke Test", parsed["title"]
          assert parsed["type"] == "pressure", parsed["type"]
          assert parsed["legacy_settings"]["target_pressure_bar"] == 8.9
          assert "\n" in parsed["notes"], "mehrzeilige Klammer nicht erkannt"
          assert semantic_hash(parsed)

          import os

          from decentespresso_mcp import __version__, milestone

          assert __version__ != "0+unbekannt", "Paketmetadaten fehlen im Image"
          assert os.environ.get("BUILD_REF"), "BUILD_REF wurde nicht durchgereicht"
          print(f"Version {__version__} ({milestone()}), Build {os.environ['BUILD_REF'][:8]}")

          import decentespresso_mcp.server  # noqa: F401  - App-Import muss tragen
          print("Profilparser im Image: ok")
          PY

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_REF=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "### Image gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "In Portainer: Stack -> Update -> 'Re-pull image' anhaken." \
            >> "$GITHUB_STEP_SUMMARY"
