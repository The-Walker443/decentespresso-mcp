name: Build and push image

# Builds an image on every push to main and puts it in the GitHub Container
# Registry ab. Portainer zieht es von dort (SPEC ss16).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  # One running build per branch is enough; a new push makes the old one moot.
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Deliberately a gate before the push: an image with failing tests should
    # not land in the registry, let alone be pulled by Portainer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by the runner automatically - no secret of our own needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The action lowercases it; ghcr.io requires that.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Load locally first, so the smoke test can run inside the *built* image.
      # Thanks to the cache the second build below only does the push.
      - name: Build (lokal laden)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: decentespresso-mcp:smoke
          build-args: |
            BUILD_REF=${{ github.sha }}
          # Build cache between runs: the pip step dominates the runtime.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test in the built image
        # Checks what cannot be checked locally: that the package is importable
        # from site-packages, that its metadata survived the build, and that a
        # profile parses in the image the way it does here.
        #
        # There used to be a Tcl interpreter check here, because the profile
        # parser needed libtk8.6 and its absence once crashed the container at
        # startup in production. Decaid ships profiles as JSON, so the parser,
        # the interpreter and the apt layer are all gone.
        run: |
          docker run --rm decentespresso-mcp:smoke python - <<'PY'
          import os

          from decentespresso_mcp import __version__, milestone
          from decentespresso_mcp.decaid_profile import profile_version

          assert __version__ != "0+unknown", "package metadata missing from the image"
          assert os.environ.get("BUILD_REF"), "BUILD_REF was not passed through"
          print(f"version {__version__} ({milestone()}), build {os.environ['BUILD_REF'][:8]}")

          # A profile the way Decaid embeds it in a workflow.
          row = profile_version({
              "title": "Smoke Test",
              "author": "Decent",
              "beverage_type": "espresso",
              "notes": "two lines" + chr(10) + "with a break",
              "target_weight": 40.0,
              "tank_temperature": 88.0,
              "steps": [
                  {"name": "Fill", "pump": "flow", "flow": 6.0, "seconds": 10,
                   "temperature": 88.0},
                  {"name": "Pour", "pump": "pressure", "pressure": 8.9,
                   "seconds": 25, "temperature": 88.0},
              ],
          })
          import json

          parsed = json.loads(row["parsed_json"])
          assert parsed["parse_ok"] is True, parsed
          assert parsed["title"] == "Smoke Test", parsed["title"]
          assert parsed["type"] == "advanced", parsed["type"]
          assert len(parsed["steps"]) == 2, parsed["steps"]
          assert chr(10) in row["profile_notes"], "the line break did not survive"
          assert row["version_hash"] and row["semantic_hash"]

          import decentespresso_mcp.server  # noqa: F401  - the app import must hold
          print("profile parse in the image: ok")
          PY


      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_REF=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "### Image gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "In Portainer: Stack -> Update -> 'Re-pull image' anhaken." \
            >> "$GITHUB_STEP_SUMMARY"
