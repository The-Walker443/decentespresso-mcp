name: Build and push image

# Baut bei jedem Push auf main ein Image und legt es in der GitHub Container
# Registry ab. Portainer zieht es von dort (SPEC ss16).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  # Ein laufender Build je Branch reicht; ein neuer Push macht den alten obsolet.
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Bewusst als Tor vor dem Push: ein Image mit roten Tests soll nicht in der
    # Registry landen und schon gar nicht von Portainer gezogen werden.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Vom Runner automatisch bereitgestellt - kein eigenes Secret noetig.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Kleinschreibung erledigt die Action; ghcr.io verlangt sie.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baucache zwischen Laeufen: der pip-Schritt dominiert die Laufzeit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "In Portainer: Stack -> Update -> 'Re-pull image' anhaken." \
            >> "$GITHUB_STEP_SUMMARY"
