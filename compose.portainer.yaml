# Stack definition for Portainer (SPEC §16).
#
# Unterschiede zu compose.yaml (lokal, baut selbst):
#   - zieht ein fertiges Image aus ghcr.io statt zu bauen
#   - a named volume rather than a bind mount: Docker creates it with the
#     ownership from the image, so the manual chown 10001 on the host is gone
#   - no .env file: Portainer fills the ${VAR} from the stack variables
#
# Zu setzende Variablen (Portainer -> Stack -> Environment variables):
#   IMAGE_REPOSITORY   z. B. ghcr.io/<owner>/decentespresso-mcp
#   IMAGE_TAG          latest  (or a sha-... for a pinned version)
#   VISUALIZER_EMAIL
#   VISUALIZER_PASSWORD
#   MCP_PATH_SECRET    openssl rand -hex 24
#   PUBLIC_BASE_URL    https://<hostname>
#   WRITE_ENABLED      false (default) or true for the write tools
#   DECAID_URL         http://10.100.100.171:8080 (nur private IPs, SPEC 20.6)
#   NTFY_URL/NTFY_TOPIC/NTFY_TOKEN   optional, Waechter-Nachrichten
#   CLOUDFLARED_NETWORK  Name des vorhandenen Tunnel-Netzes

services:
  decentespresso-mcp:
    image: ${IMAGE_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: decentespresso-mcp
    restart: unless-stopped

    environment:
      VISUALIZER_EMAIL: ${VISUALIZER_EMAIL}
      VISUALIZER_PASSWORD: ${VISUALIZER_PASSWORD}
      MCP_PATH_SECRET: ${MCP_PATH_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-15}
      WRITE_ENABLED: ${WRITE_ENABLED:-false}
      DECAID_URL: ${DECAID_URL}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      GUARD_RULES: ${GUARD_RULES:-}
      BEAN_AGE_WARN_DAYS: ${BEAN_AGE_WARN_DAYS:-42}
      RATING_GRACE_HOURS: ${RATING_GRACE_HOURS:-36}
      DOSE_TOLERANCE_G: ${DOSE_TOLERANCE_G:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Berlin}
      DB_PATH: /data/shots.db

    volumes:
      - decentespresso_mcp_data:/data

    networks:
      # tunnel = the way in for Claude. Decaid is NEVER addressed through it
      # (SPEC §20.6); for that the container needs a route onto the local
      # network - depending on the setup the host network or a macvlan.
      - tunnel

    # No host ports: reachable only over the internal Docker network (SPEC §10.4).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      # Without a cap the log grows without bound - the container runs forever.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  decentespresso_mcp_data:
    name: decentespresso_mcp_data

networks:
  tunnel:
    external: true
    name: ${CLOUDFLARED_NETWORK}
