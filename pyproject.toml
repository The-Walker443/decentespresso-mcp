[project]
name = "visualizer-mcp"
version = "0.1.0"
description = "MCP-Server fuer Espresso-Shot-Analyse (visualizer.coffee -> SQLite -> Claude)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10,<3",
    "httpx>=0.27",
]

# apscheduler kommt erst mit M1 (Sync-Worker) dazu - siehe SPEC ss3.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
visualizer-mcp = "visualizer_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
