[project]
name = "decentespresso-mcp"
version = "0.9.0"
description = "MCP-Server fuer Espresso-Shot-Analyse (Decent DE1 -> Decaid -> SQLite -> Claude)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10,<3",
    "httpx>=0.27",
    # Zeitzonendatenbank fuer zoneinfo. Ob ein schlankes Basisimage
    # /usr/share/zoneinfo mitbringt, ist nicht zugesichert; die Umrechnung der
    # Ortszeit-Stempel auf UTC haengt aber daran (decaid_mapping).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
decentespresso-mcp = "decentespresso_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Damit tests/helpers.py per Namen importierbar ist.
pythonpath = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
