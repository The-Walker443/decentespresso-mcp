[project]
name = "decentespresso-mcp"
version = "0.9.0"
description = "MCP server for espresso shot analysis (Decent DE1 -> Decaid -> SQLite -> Claude)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=2.10,<3",
    "httpx>=0.27",
    # Time zone database for zoneinfo. A slim base image is not guaranteed to
    # carry /usr/share/zoneinfo, and converting the local-time stamps to UTC
    # depends on it (decaid_mapping).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
decentespresso-mcp = "decentespresso_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So that tests/helpers.py is importable by name.
pythonpath = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
