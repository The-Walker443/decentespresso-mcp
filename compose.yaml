services:
  decentespresso-mcp:
    build: .
    container_name: decentespresso-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data          # must be owned by UID 10001 (see the README)
    networks:
      - cloudflared_net       # adjust to the tunnel's existing network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    # No host ports: reachable only over the internal Docker network (SPEC §12).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  cloudflared_net:
    external: true
